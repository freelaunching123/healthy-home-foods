version: "3.9"

services:
  db:
    image: postgres:15
    container_name: hhf_postgres
    restart: always
    environment:
      POSTGRES_USER: hhf_user
      POSTGRES_PASSWORD: hhf_password
      POSTGRES_DB: healthy_home_foods
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: hhf_backend
    restart: always
    depends_on:
      - db
    ports:
      - "1234:1234"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 1234 --reload

volumes:
  postgres_data:
