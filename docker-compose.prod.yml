version: '3.8'

services:
  db:
    image: postgres:15
    container_name: hhf_postgres_prod
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hhf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretPassword123}
      POSTGRES_DB: ${POSTGRES_DB:-hhf_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - hhf_network_prod

  redis:
    image: redis:7-alpine
    container_name: hhf_redis_prod
    restart: always
    volumes:
      - redis_data_prod:/data
    networks:
      - hhf_network_prod

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: hhf_backend_prod
    restart: always
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-hhf_user}:${POSTGRES_PASSWORD:-SuperSecretPassword123}@db:5432/${POSTGRES_DB:-hhf_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - DEBUG=False
      - ALLOWED_ORIGINS=https://yourdomain.com,https://admin.yourdomain.com
    # Do not expose ports directly to host, only via network for Nginx
    expose:
      - "1234"
    volumes:
      - ./backend/uploads:/app/uploads
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:1234
    networks:
      - hhf_network_prod

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hhf_celery_worker_prod
    restart: always
    depends_on:
      - db
      - redis
      - backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-hhf_user}:${POSTGRES_PASSWORD:-SuperSecretPassword123}@db:5432/${POSTGRES_DB:-hhf_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
    command: celery -A app.tasks.celery_app worker -l info
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - hhf_network_prod

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hhf_celery_beat_prod
    restart: always
    depends_on:
      - redis
      - backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-hhf_user}:${POSTGRES_PASSWORD:-SuperSecretPassword123}@db:5432/${POSTGRES_DB:-hhf_db}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    command: celery -A app.tasks.celery_app beat -l info
    networks:
      - hhf_network_prod

  nginx:
    image: nginx:alpine
    container_name: hhf_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./backend/uploads:/var/www/uploads
    depends_on:
      - backend
    networks:
      - hhf_network_prod

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  hhf_network_prod:
    driver: bridge
